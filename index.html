<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator Website</title>
    <link rel="stylesheet" href="css/style_01.css" />
    <script src="js/script.js" defer></script>
  </head>

  <body>
    <div class="calculator">
      <div class="display-container">
        <div id="display">
          <div id="expression">0</div>
          <div id="result">0</div>
        </div>
      </div>
      <div class="basic-buttons">
        <button class="btn action" data-value="Clear">AC</button>
        <button class="btn action" data-value="DEL">DEL</button>
        <button class="btn operator" data-value="%">%</button>
        <button class="btn operator" data-value="/">/</button>

        <button class="btn" data-value="7">7</button>
        <button class="btn" data-value="8">8</button>
        <button class="btn" data-value="9">9</button>
        <button class="btn operator" data-value="X">&#xd7;</button>

        <button class="btn" data-value="4">4</button>
        <button class="btn" data-value="5">5</button>
        <button class="btn" data-value="6">6</button>
        <button class="btn operator" data-value="-">-</button>

        <button class="btn" data-value="1">1</button>
        <button class="btn" data-value="2">2</button>
        <button class="btn" data-value="3">3</button>
        <button class="btn operator" data-value="+">&#x002B;</button>

        <button class="btn" data-value="0">0</button>
        <button class="btn" data-value=".">.</button>
        <button class="btn equal">=</button>
      </div>
    </div>
  </body>
</html>
